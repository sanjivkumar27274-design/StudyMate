<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- notes.html -->
<title>StudyMate - Notes</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="notes.css">
    <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <span>📚</span>
            <h2>StudyMate</h2>
        </div>

        <nav>

            <a href="../index.html">
                <span>🏠</span>
                Dashboard
            </a>

            <a href="tasks.html">
                <span>✅</span>
                Tasks
            </a>

            <a href="planner.html">
                <span>📅</span>
                Study Planner
            </a>

            <a href="notes.html" class="active">
                <span>📝</span>
                Notes
            </a>

            <a href="pomodoro.html">
                <span>⏱️</span>
                Pomodoro
            </a>

            <a href="progress.html">
                <span>📊</span>
                Progress
            </a>

        </nav>

        <div class="sidebar-bottom">
            <button id="themeBtn">🌙 Dark Mode</button>
        </div>

    </aside>


    <!-- Main Content -->
    <main class="main">

        <header class="header">

            <div>
                <h1>My Notes 📝</h1>

                <p>
                    Create and manage your study notes.
                </p>
            </div>

            <div class="profile">

                <div class="profile-icon">
                    S
                </div>

                <div>
                    <strong>Sanjiv Kumar</strong>
                    <small>My Profile</small>
                </div>

            </div>

        </header>


        <!-- Notes Statistics -->
        <section class="notes-stats">

            <div class="notes-stat">
                <div class="notes-stat-icon">📝</div>

                <div>
                    <p>Total Notes</p>
                    <h2 id="totalNotes">0</h2>
                </div>
            </div>


            <div class="notes-stat">
                <div class="notes-stat-icon">📚</div>

                <div>
                    <p>Total Subjects</p>
                    <h2 id="totalSubjects">0</h2>
                </div>
            </div>


            <div class="notes-stat">
                <div class="notes-stat-icon">📅</div>

                <div>
                    <p>Latest Note</p>
                    <h2 id="latestNote">-</h2>
                </div>
            </div>

        </section>


        <!-- Notes Container -->
        <section class="notes-container">


            <!-- Create / Edit Note -->
            <div class="card note-form-card">

                <div class="card-header">

                    <div>
                        <h2 id="noteFormTitle">Create New Note</h2>

                        <p id="noteFormDescription">
                            Save important study information
                        </p>
                    </div>

                </div>


                <form id="noteForm">

                    <div class="form-group">

                        <label for="noteTitle">
                            Note Title
                        </label>

                        <input
                            type="text"
                            id="noteTitle"
                            placeholder="e.g. JavaScript DOM"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="noteSubject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="noteSubject"
                            placeholder="e.g. Web Development"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="noteContent">
                            Note Content
                        </label>

                        <textarea
                            id="noteContent"
                            rows="8"
                            placeholder="Write your notes here..."
                            required
                        ></textarea>

                    </div>


                    <div class="note-form-buttons">

                        <button
                            type="submit"
                            class="note-add-btn"
                            id="noteSubmitBtn"
                        >
                            + Save Note
                        </button>

                        <button
                            type="button"
                            class="note-cancel-btn"
                            id="noteCancelBtn"
                            style="display: none;"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>


            <!-- Notes List -->
            <div class="card notes-list-card">

                <div class="card-header">

                    <div>
                        <h2>My Notes</h2>

                        <p>
                            Your saved notes
                        </p>
                    </div>

                    <input
                        type="search"
                        id="searchNotes"
                        placeholder="Search notes..."
                    >

                </div>


                <div id="notesList" class="notes-list">

                </div>

            </div>

        </section>

    </main>


    <script src="notes.js"></script>

</body>

</html>
